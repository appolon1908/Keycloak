name: Codestra control plane

on:
  pull_request:
  push:
    branches: [main, development, testing, staging, production]

permissions:
  contents: read

jobs:
  codestra_control_plane:
    name: codestra-control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -q pytest PyYAML
      - name: Compile identity authority
        run: python scripts/keycloak_identity_compiler.py
      - name: Validate MCR identity source locks
        run: python scripts/validate_mcr_identity.py
      - name: Validate CIP identity and integrity
        run: python -m pytest -q tests/test_keycloak_identity_invariants.py tests/test_cip_release_contract_integrity.py
      - name: Verify generated authority is committed
        run: git diff --exit-code -- generated/keycloak-identity-authority.v1.json

  codestra_control_plane_legacy:
    name: codestra/control-plane
    needs: [codestra_control_plane]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -q pytest PyYAML
      - name: Verify release trust evidence
        run: |
          python scripts/validate_mcr_identity.py
          python -m pytest -q tests/test_cip_release_contract_integrity.py
          test -f release/cip-tenant-identity/keycloak-cip-gateway-identity-contract.v1.sha256
          test -f release/cip-tenant-identity/keycloak-cip-tenant-identity-desired-state-plan.sha256
