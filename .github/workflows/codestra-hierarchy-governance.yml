name: Codestra Hierarchy Governance
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify the governance bootstrap
        id: bootstrap
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HEAD_REF" = "governance/development-control-plane-v1" ] && [ "$BASE_REF" = "main" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.bootstrap.outputs.allowed != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce promotion path
        if: steps.bootstrap.outputs.allowed != 'true'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 governance/promotion_guard.py

  control-plane-certification:
    name: control-plane-certification
    runs-on: [self-hosted, linux, x64, codestra-control-plane]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - name: Verify exact SHA in Codestra development control plane
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          /srv/codestra/dev-platform/control-plane/bin/codestra-github-check \
            --product 'keycloak' \
            --repo-path '/srv/codestra/apps/Keycloak' \
            --head-ref "$HEAD_REF" \
            --base-ref "$BASE_REF" \
            --head-sha "$HEAD_SHA"
